<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CardMaker</title>
    <meta name="application-name" content="CardMaker" />
    <base href="/" />
    <script>
        (function() {
            try {
                let theme = localStorage.getItem('cm-theme') || 'system';
                if (theme === 'system') {
                    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-bs-theme', theme);
            } catch (e) {}
        })();
    </script>
    <link rel="icon" type="image/x-icon" href="icon.ico" />
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="_content/CardMaker.UI/css/cardmaker-theme.css" />
    <link rel="stylesheet" href="app.css" />
</head>
<body>
    <div id="app">
        <div class="cm-splash-screen">
            <div class="cm-splash-card">
                <div class="cm-splash-icon mb-2">
                    <img src="icon.png" width="72" height="72" class="rounded shadow-sm" alt="CardMaker" />
                </div>
                <h1 class="cm-splash-title">CardMaker</h1>
                <div class="cm-splash-progress-container">
                    <div class="cm-splash-progress-bar"></div>
                </div>
                <p class="cm-splash-status">Avvio in corso...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="_content/CardMaker.UI/js/theme.js"></script>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
